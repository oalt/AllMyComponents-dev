name: Build solution (Integration Build)

# Builds the whole solution once to make sure that no compiler errors occur.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (including submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AllMyComponents-dev.sln

      - name: Build
        run: dotnet build src/AllMyComponents-dev.sln --configuration Release --no-restore
